[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intrarepresentational-alignment"
version = "0.1.0"
description = "Tools for intrarepresentational alignment analysis over metaphor datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "gensim>=4.3,<5",
    "rdflib>=7.0,<8",
    "ipykernel>=6.29,<7",
    "ipywidgets>=8.0,<9",
    "matplotlib>=3.8,<4",
    "networkx>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[tool.setuptools.packages.find]
include = ["intrarepresentational_alignment*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-ra"
